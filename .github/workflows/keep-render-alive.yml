```yaml
name: Keep Render Services Alive

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  ping-services:
    name: Ping Render Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Ping all Render services
        env:
          GATEWAY_URL: https://gateway-iknp.onrender.com/
          AUTH_URL: https://auth-service-fya3.onrender.com/
          PROJECT_URL: https://project-service-mwej.onrender.com/
          FILES_URL: https://files-service-cc1l.onrender.com/
          AI_URL: https://ai-service-z31q.onrender.com/
          TERMINAL_URL: https://terminal-service-07rg.onrender.com/health
          PAYMENT_URL: https://payment-service-i6ry.onrender.com/
        run: |
          set +e

          urls=(
            "$GATEWAY_URL"
            "$AUTH_URL"
            "$PROJECT_URL"
            "$FILES_URL"
            "$AI_URL"
            "$TERMINAL_URL"
            "$PAYMENT_URL"
          )

          names=(
            "API Gateway"
            "Auth Service"
            "Project Service"
            "Files Service"
            "AI Service"
            "Terminal Service"
            "Payment Service"
          )

          failed=0

          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            name="${names[$i]}"

            echo "Checking $name..."

            status=$(curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 15 \
              --max-time 90 \
              "$url")
            
            result=$?

            if [ "$result" -eq 0 ] && [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "SUCCESS: $name returned HTTP $status"
            else
              echo "WARNING: $name failed. HTTP status: ${status:-000}, curl exit code: $result"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more services failed their health checks."
            exit 1
          fi

          echo "All seven services responded successfully."
```
